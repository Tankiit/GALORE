# Larger Dataset Configuration
# More samples for better learning

# Dataset Configuration
dataset:
  name: "datacomp"
  root: "./data"
  size: 10000  # 10x larger dataset
  image_size: 224

# Model Configuration
model:
  clip_model: "ViT-B-32"
  pretrained: "openai"
  device: "cuda"
  mixed_precision: true

# Selection Configuration
selection:
  strategy: "one_shot"
  budget: 0.5  # Select 50% (5000 samples)
  batch_size: 256  # Larger batches
  nuclear_norm_weight: 0.3
  clip_score_weight: 0.7

# Training Configuration
training:
  epochs: 50  # Fewer epochs but more data per epoch
  batch_size: 64  # Larger batch size
  learning_rate: 0.0001  # Same adaptive LR
  warmup_steps: 200  # Longer warmup
  optimizer: "adamw"
  weight_decay: 0.01
  gradient_clip: 1.0

# Iterative MODE Configuration
iterative:
  cycles: 3
  samples_per_cycle: 500

# Gradient Cache Configuration
cache:
  enabled: true
  max_size_mb: 2048  # More cache
  staleness_threshold: 200
  bloom_filter_size: 50000
  hash_functions: 4

# Logging Configuration
logging:
  tensorboard: true
  tensorboard_dir: "./runs"
  log_frequency: 20
  save_frequency: 500
  verbose: true

# Output Configuration
output:
  checkpoint_dir: "./checkpoints"
  results_dir: "./results"
  save_selected_indices: true
  save_model: true

# Server Configuration
server:
  distributed: false
  world_size: 1
  rank: 0
  backend: "nccl"
  init_method: "env://"

# Experiment Metadata
experiment:
  name: "datacomp_mode_larger"
  description: "Larger dataset (10K samples, 50% selection) with adaptive scheduler"
  seed: 42
  tags: ["large-scale", "adaptive-lr"]
