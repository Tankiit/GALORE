# DataComp MODE Configuration
# Easy-to-edit config for server deployment

# Dataset Configuration
dataset:
  name: "datacomp"  # or "cifar10", "imagenet", etc.
  root: "./data"
  size: 1000  # Number of samples (use -1 for full dataset)
  image_size: 224

# Model Configuration
model:
  clip_model: "ViT-B-32"  # Options: ViT-B-32, ViT-B-16, ViT-L-14, RN50
  pretrained: "openai"
  device: "cuda"  # cuda or cpu
  mixed_precision: true

# Selection Configuration
selection:
  strategy: "one_shot"  # Options: one_shot, iterative, hybrid
  budget: 0.3  # Fraction of data to select (0.0 to 1.0)
  batch_size: 128
  nuclear_norm_weight: 0.3  # Weight for nuclear norm in scoring
  clip_score_weight: 0.7    # Weight for CLIP score in scoring

# Training Configuration
training:
  epochs: 10
  batch_size: 32
  learning_rate: 0.000001
  warmup_steps: 100
  optimizer: "adamw"  # adamw or adam
  weight_decay: 0.01
  gradient_clip: 1.0

# Iterative MODE Configuration (for iterative strategy)
iterative:
  cycles: 3
  samples_per_cycle: 100

# Gradient Cache Configuration
cache:
  enabled: true
  max_size_mb: 500
  staleness_threshold: 100
  bloom_filter_size: 10000
  hash_functions: 3

# Logging Configuration
logging:
  tensorboard: true
  tensorboard_dir: "./runs"
  log_frequency: 10  # Log every N steps
  save_frequency: 100  # Save checkpoint every N steps
  verbose: true

# Output Configuration
output:
  checkpoint_dir: "./checkpoints"
  results_dir: "./results"
  save_selected_indices: true
  save_model: true

# Server Configuration (for distributed training)
server:
  distributed: false
  world_size: 1
  rank: 0
  backend: "nccl"  # nccl or gloo
  init_method: "env://"

# Experiment Metadata
experiment:
  name: "datacomp_mode_v1"
  description: "DataComp MODE with hybrid scoring"
  seed: 42
  tags: ["datacomp", "mode", "vlm"]
